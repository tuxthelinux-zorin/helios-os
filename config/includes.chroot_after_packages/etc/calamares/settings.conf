---
modules-search: [ local ]
instances:
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf
sequence:
- show: [ welcome, locale, keyboard, partition, users, summary ]
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@postinstall
  - initramfs
  - grubcfg
  - bootloader
  - removeuser
  - umount
- show: [ finished ]
branding: debian
prompt-install: true
disable-cancel-during-exec: true
