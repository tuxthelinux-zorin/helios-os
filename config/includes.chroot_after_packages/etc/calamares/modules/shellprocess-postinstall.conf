dontChroot: false
timeout: 300
script:
  - command: "rm -f /etc/sddm.conf.d/20-live.conf"
  - command: "apt-get -y purge live-boot live-boot-initramfs-tools live-config live-config-systemd calamares calamares-settings-debian"
  - command: "apt-get -y autoremove --purge"
  - command: "flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true"
