btrfsSubvolumes:
  - { mountPoint: /,                subvolume: /@ }
  - { mountPoint: /home,            subvolume: /@home }
  - { mountPoint: /.snapshots,      subvolume: /@snapshots }
  - { mountPoint: /var/log,         subvolume: /@var_log }
  - { mountPoint: /var/cache,       subvolume: /@var_cache }
  - { mountPoint: /var/lib/flatpak, subvolume: /@flatpak }
btrfsSwapSubvolume: /@swap
mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, space_cache=v2, discard=async ]
