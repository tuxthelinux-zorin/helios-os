name: build-iso
on:
  push: { branches: [ main ], tags: [ 'v*' ] }
  workflow_dispatch:
    inputs:
      custom_kernel:
        description: 'Build and use the Helios custom kernel (adds 1-3 hours)'
        type: boolean
        default: false
env:
  KVER: '7.3'
jobs:
  kernel:
    if: ${{ inputs.custom_kernel }}
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - run: bash kernel/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: helios-kernel
          path: |
            kernel-out/*.deb
            kernel-out/KERNELRELEASE
  iso:
    needs: [ kernel ]
    if: ${{ always() && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools gnupg git ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.kernel.result == 'success' }}
        with:
          name: helios-kernel
          path: config/packages.chroot
      - name: Build ISO
        run: |
          if [ -f config/packages.chroot/KERNELRELEASE ]; then
            export HELIOS_KERNEL="$(cat config/packages.chroot/KERNELRELEASE)"
            echo "Using custom kernel $HELIOS_KERNEL"
          fi
          chmod +x auto/* config/hooks/live/* \
            config/includes.chroot_after_packages/usr/bin/helium \
            config/includes.chroot_after_packages/usr/libexec/helium-firstboot
          ./auto/config
          lb build
          sha256sum *.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: helios-iso
          path: |
            *.iso
            SHA256SUMS
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS
